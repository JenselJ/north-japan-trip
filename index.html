<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>North Japan Trip — Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #5b6270;
    --panel: rgba(255,255,255,.95); --border: rgba(0,0,0,.14);
    --shadow: 0 2px 12px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8eaed; --muted: #a2a9b6;
      --panel: rgba(28,31,37,.95); --border: rgba(255,255,255,.16);
      --shadow: 0 2px 12px rgba(0,0,0,.55);
    }
  }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #map { position:absolute; inset:0; width:100%; height:100%; }

  #title {
    position:absolute; top:10px; left:50px; z-index:1000;
    background:var(--panel); color:var(--fg); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; box-shadow:var(--shadow);
    font-weight:600; font-size:14px; letter-spacing:.01em;
  }
  #title small { display:block; font-weight:400; font-size:11.5px; color:var(--muted); }

  .legend {
    background:var(--panel); color:var(--fg); border:1px solid var(--border);
    border-radius:8px; padding:8px 10px; box-shadow:var(--shadow); line-height:1.7; font-size:13px;
    max-width:min(52vw, 190px);
  }
  .legend h4 { margin:0 0 5px; font-size:11px; text-transform:uppercase;
    letter-spacing:.07em; color:var(--muted); font-weight:600; }
  .legend .row { display:flex; align-items:flex-start; gap:7px; }
  .legend .row i { margin-top:5px; }
  .legend i { width:12px; height:12px; border-radius:50%; flex:0 0 auto;
    border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.35); }

  .leaflet-popup-content { margin:11px 13px; min-width:210px; max-width:290px; }
  .pop-name { font-weight:700; font-size:15px; margin:0 0 1px; }
  .pop-ja   { color:var(--muted); font-size:12.5px; margin:0 0 7px; }
  .pop-cat  { display:inline-block; font-size:10.5px; font-weight:700; color:#fff;
    padding:2px 7px; border-radius:99px; margin-bottom:8px; letter-spacing:.02em; }
  .pop-row  { display:flex; gap:7px; margin:3px 0; font-size:13px; }
  .pop-row b { flex:0 0 62px; color:var(--muted); font-weight:600; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.04em; padding-top:1px; }
  .pop-notes { margin-top:8px; padding-top:7px; border-top:1px solid var(--border);
    font-size:12.5px; color:var(--muted); }
  .star { color:#f5a623; }

  /* Phone: stack controls, shrink chrome, keep the map usable one-handed */
  @media (max-width: 620px) {
    #title { left:50px; right:10px; font-size:13px; padding:5px 9px; }
    .legend { font-size:11px; padding:6px 8px; line-height:1.35; max-width:50vw; }
    .legend .row { gap:5px; }
    .legend i { width:9px; height:9px; border-width:1.5px; }
    .legend h4 { font-size:9.5px; margin-bottom:3px; }
    .leaflet-control-layers { font-size:13px; }
    .leaflet-popup-content { min-width:0; max-width:76vw; }
  }
</style>
</head>
<body>
<div id="title">North Japan Trip <small>30 Jan – 13 Feb 2027 · 7 travellers</small></div>
<div id="map"></div>

<script>
// ---------------------------------------------------------------------------
// Places live in locations.geojson. Never hardcode a place in this file.
// The category list here must stay in sync with CLAUDE.md.
// ---------------------------------------------------------------------------
var CATEGORY_COLOURS = {
  "Food & drink":       "#e6550d",
  "Anime":              "#7b6bd6",
  "Onsen & sentō":      "#2b8cbe",
  "Unique / rare":      "#2f9e44",
  "Festivals & events": "#d6336c",
  "Round1":             "#00a2b3"
};
var FALLBACK_COLOUR = "#7a828f";

var map = L.map("map", { scrollWheelZoom: true, tap: true });

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

map.setView([39.0, 140.2], 6); // north Honshu, replaced by fitBounds once data loads

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function colourFor(cat) { return CATEGORY_COLOURS[cat] || FALLBACK_COLOUR; }

function markerFor(feature, latlng) {
  return L.circleMarker(latlng, {
    radius: 8, color: "#fff", weight: 2, opacity: 1,
    fillColor: colourFor(feature.properties.category), fillOpacity: 0.95
  });
}

function popupFor(p) {
  var star = Number(p.stars) === 1 ? ' <span class="star" title="Must-do">&#9733;</span>' : "";
  var html = '<div class="pop-name">' + esc(p.name) + star + "</div>";
  if (p.name_ja) html += '<div class="pop-ja">' + esc(p.name_ja) + "</div>";
  html += '<span class="pop-cat" style="background:' + colourFor(p.category) + '">' +
          esc(p.category) + "</span>";

  [["City", p.city], ["Cost", p.cost], ["Access", p.access],
   ["Booking", p.booking], ["Dates", p.dates]].forEach(function (r) {
    if (r[1]) html += '<div class="pop-row"><b>' + r[0] + "</b><span>" + esc(r[1]) + "</span></div>";
  });

  if (p.notes) html += '<div class="pop-notes">' + esc(p.notes) + "</div>";
  return html;
}

fetch("locations.geojson", { cache: "no-store" })
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status + " fetching locations.geojson");
    return r.json();
  })
  .then(function (data) {
    // One layer per category so the layer control can toggle each independently.
    var layers = {};
    Object.keys(CATEGORY_COLOURS).forEach(function (c) { layers[c] = L.featureGroup(); });
    var other = L.featureGroup();
    var all = [];

    L.geoJSON(data, {
      pointToLayer: markerFor,
      onEachFeature: function (f, layer) {
        layer.bindPopup(popupFor(f.properties || {}), { maxWidth: 300 });
        var cat = (f.properties || {}).category;
        (layers[cat] || other).addLayer(layer);
        all.push(layer);
      }
    });

    var overlays = {};
    Object.keys(layers).forEach(function (c) {
      var n = layers[c].getLayers().length;
      if (!n) return;                       // hide empty categories from the control
      layers[c].addTo(map);
      overlays['<span style="color:' + CATEGORY_COLOURS[c] + '">&#9679;</span> ' + c + " (" + n + ")"] = layers[c];
    });
    if (other.getLayers().length) {
      other.addTo(map);
      overlays["Uncategorised (" + other.getLayers().length + ")"] = other;
    }

    L.control.layers(null, overlays, { collapsed: window.innerWidth < 620 }).addTo(map);

    var legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      var div = L.DomUtil.create("div", "legend");
      var rows = Object.keys(CATEGORY_COLOURS).map(function (c) {
        var n = layers[c] ? layers[c].getLayers().length : 0;
        var dim = n ? "" : ' style="opacity:.4"';
        return '<div class="row"' + dim + '><i style="background:' + CATEGORY_COLOURS[c] +
               '"></i><span>' + c + "</span></div>";
      }).join("");
      div.innerHTML = "<h4>Category</h4>" + rows;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    legend.addTo(map);

    if (all.length) {
      var pad = window.innerWidth < 620 ? [30, 70] : [60, 60];
      map.fitBounds(L.featureGroup(all).getBounds(), { padding: pad, maxZoom: 14 });
    }
  })
  .catch(function (err) {
    console.error(err);
    var note = L.control({ position: "topright" });
    note.onAdd = function () {
      var d = L.DomUtil.create("div", "legend");
      d.innerHTML = "<h4>Could not load places</h4>" + esc(err.message) +
        "<br><br>If you opened this file directly (file://), run a local server instead:" +
        "<br><code>python3 -m http.server</code>";
      return d;
    };
    note.addTo(map);
  });
</script>
</body>
</html>
